name: Build Bible Verse Shorts APK

on:

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "35"
      ANDROID_MIN_API: "24"
      NDK_VERSION: "27.2.12479018"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Export Android paths
        run: |

          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Linux build dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            wget \
            curl \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            gettext \
            python3-dev

      - name: Install python-for-android
        run: |

          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "python-for-android"

      - name: Download Piper voice model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          mkdir -p assets

          if [ ! -f assets/en_US-ryan-high.onnx ]; then

            echo "Downloading Piper model..."

            curl \
              -L \
              --fail \
              -o assets/en_US-ryan-high.onnx \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/piper-voice/en_US-ryan-high.onnx"

          fi

          ls -lh assets/

      - name: Verify required assets
        run: |

          test -f assets/en_US-ryan-high.onnx

          test -f assets/en_US-ryan-high.onnx.json

          test -f assets/font.ttf

          test -f assets/bg.mp3

      - name: Show project
        run: |

          echo "================ PROJECT ================"

          find . \
            -maxdepth 4 \
            -type f \
            -not -path "./.git/*" \
            | sort

          echo "========================================="

      - name: Build APK
        run: |

          mkdir -p dist

          p4a apk \
            --private . \
            --package com.bibleverseshorts.app \
            --name "BibleVerseShorts" \
            --version 1.0.0 \
            --bootstrap sdl2 \
            --requirements "python3,kivy,ffmpeg,libx264,av_codecs,piper" \
            --arch arm64-v8a \
            --android-api "${ANDROID_API}" \
            --ndk-api "${ANDROID_MIN_API}" \
            --orientation portrait \
            --window \
            --presplash-color 000000 \
            --color always \
            --debug

      - name: Find APK
        run: |

          mkdir -p dist

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find . \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not created."

            exit 1

          fi

          cp "$APK" \
            "dist/BibleVerseShorts-arm64-debug.apk"

          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerseShorts-APK
          path: dist/BibleVerseShorts-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30
