name: Build Bible Verse Shorts APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_MIN_API: "24"
  NDK_VERSION: "27.2.12479018"

jobs:

  build-apk:

    name: Build ARM64 APK

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Configure Android
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" \
            >> "$GITHUB_ENV"

          echo "${ANDROID_SDK_ROOT}/platform-tools" \
            >> "$GITHUB_PATH"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            build-essential \
            ccache \
            cmake \
            gettext \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            make \
            ninja-build \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            unzip \
            wget \
            zip

      - name: Install p4a
        shell: bash
        run: |
          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            python-for-android

      - name: Verify p4a
        shell: bash
        run: |
          python -m pythonforandroid.toolchain --help

      - name: Verify custom recipes
        shell: bash
        run: |
          set -e

          test -f p4a-recipes/onnxruntime/__init__.py
          test -f p4a-recipes/piper/__init__.py
          test -f p4a-recipes/piper_phonemize/__init__.py

          python - <<'PY'
          import sys
          sys.path.insert(0, "p4a-recipes")

          import onnxruntime
          import piper
          import piper_phonemize

          assert hasattr(onnxruntime, "recipe")
          assert hasattr(piper, "recipe")
          assert hasattr(piper_phonemize, "recipe")

          print("onnxruntime recipe:", onnxruntime.recipe)
          print("piper recipe:", piper.recipe)
          print(
              "piper_phonemize recipe:",
              piper_phonemize.recipe
          )

          print("Custom recipes OK.")
          PY

      - name: List recipes
        shell: bash
        run: |
          set -o pipefail
          p4a recipes > recipes.txt
          head -150 recipes.txt

      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f main.py
          test -f requirements.txt
          test -f .p4a

          test -f src/generator.py
          test -f src/piper_bridge.c
          test -f src/piper_bridge.h

          test -f p4a-recipes/onnxruntime/__init__.py
          test -f p4a-recipes/piper/__init__.py
          test -f p4a-recipes/piper_phonemize/__init__.py

          test -f assets/bg.mp3
          test -f assets/font.ttf
          test -f assets/en_US-ryan-high.onnx.json

      - name: Download Piper model
        shell: bash
        run: |
          set -e

          mkdir -p assets

          MODEL="assets/en_US-ryan-high.onnx"

          if [ ! -s "$MODEL" ]; then

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --output "$MODEL" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/piper-voice/en_US-ryan-high.onnx"

          fi

          test -s "$MODEL"

          ls -lh "$MODEL"

      - name: Verify model
        shell: bash
        run: |
          set -e

          test -s assets/en_US-ryan-high.onnx
          test -s assets/en_US-ryan-high.onnx.json

          ls -lh \
            assets/en_US-ryan-high.onnx \
            assets/en_US-ryan-high.onnx.json

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          mkdir -p build/p4a
          mkdir -p dist

          python -m pythonforandroid.toolchain apk \
            --private . \
            --package com.bibleverseshorts.app \
            --name "BibleVerseShorts" \
            --version 1.0.0 \
            --bootstrap sdl2 \
            --requirements python3,kivy,ffmpeg,libx264,av_codecs,onnxruntime,piper \
            --arch arm64-v8a \
            --android-api "${ANDROID_API}" \
            --ndk-api "${ANDROID_MIN_API}" \
            --orientation portrait \
            --window \
            --presplash-color 000000 \
            --debug \
            --color always \
            2>&1 | tee build/p4a/build.log

      - name: Diagnose build
        if: failure()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "BUILD FAILED"
          echo "=============================================="

          if [ -f build/p4a/build.log ]; then

            echo
            echo "----- LAST 400 LINES -----"

            tail -400 build/p4a/build.log

            echo
            echo "----- ERRORS -----"

            grep -n -i \
              -E \
              "error:|fatal error|CMake Error|FAILED|undefined reference|not found|No such file" \
              build/p4a/build.log \
              | tail -200 \
              || true

          fi

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          APK="$(find . \
            -type f \
            -name '*.apk' \
            -not -path './.git/*' \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "No APK found."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          cp "$APK" \
            dist/BibleVerseShorts-arm64-debug.apk

          ls -lh \
            dist/BibleVerseShorts-arm64-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerseShorts-ARM64-APK
          path: dist/BibleVerseShorts-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerseShorts-Build-Log
          path: build/p4a/build.log
          if-no-files-found: ignore
          retention-days: 30
